{% extends "base.html" %}

{% block content %}
<article class="entry-detail">
    <h2>{{ entry.title }}</h2>
    <p class="date">{{ entry.date }}</p>
    <div class="content">
        {{ entry.content|replace('\n', '<br>')|safe }}
    </div>
    <div class="detail-actions">
        <a href="{{ url_for('edit', entry_id=entry.id) }}" class="btn-edit">✏️ Редактировать</a>
        <form action="{{ url_for('delete', entry_id=entry.id) }}" method="POST" style="display: inline;">
            <button type="submit" class="btn-delete" onclick="return confirm('Вы уверены?')">🗑️ Удалить</button>
        </form>
        <a href="{{ url_for('index') }}" class="btn-back">← На главную</a>
    </div>
</article>
{% endblock %}
